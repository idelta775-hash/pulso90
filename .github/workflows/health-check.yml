name: Pulso 90 health check
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public portal and feeds
        run: node health-check.mjs
